name: test

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 装 ruff
        run: pip install ruff
      - name: 查代码风格
        run: ruff check src tests

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装
        run: pip install -e ".[dev]"
      - name: 冒烟：装完能不能跑起来
        # 只验"装得上、入口在"。真正的评测要联网调模型，CI 里不跑。
        run: |
          harnessdrift --help
          python -c "import harnessdrift; print(harnessdrift.__version__)"
      - name: 跑测试
        # 整套测试不碰网络：调模型的地方都注入了假的 LLM，所以 CI 里不需要 API key。
        # 故意不给 key，任何一处偷偷发起真实请求都会让这里挂掉。
        env:
          LLM_API_KEY: ""
        run: pytest

  dashboard:
    # 导出看板并做一次无浏览器的渲染冒烟。防的是"导出成功但页面白屏"——
    # 这种问题单跑 pytest 发现不了，只有真人打开才看得见。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装
        run: pip install -e ".[dev]"
      - name: 导出
        run: |
          PYTHONPATH=src python -m harnessdrift.cli export \
            --run runs/curve3 --attr runs/attr_curve3 \
            --compare runs/ablate_strict,runs/ablate_nonregress,runs/ablate_always \
            --out dist/index.html
      - name: 渲染冒烟
        run: node web/smoke.cjs dist/index.html