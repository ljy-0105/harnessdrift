name: test

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 装 ruff
        run: pip install ruff
      - name: 查代码风格
        run: ruff check src tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 构建 wheel
        run: pip wheel . --no-deps --wheel-dir wheelhouse
      - name: 确认看板模板进了 wheel
        run: |
          python -c "import glob, zipfile; w = glob.glob('wheelhouse/*.whl')[0]; names = zipfile.ZipFile(w).namelist(); assert 'harnessdrift/template.html' in names, names"

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装
        run: pip install -e ".[dev]"
      - name: 冒烟：装完能不能跑起来
        # 只验"装得上、入口在"。真正的评测要联网调模型，CI 里不跑。
        run: |
          harnessdrift --help
          python -c "import harnessdrift; print(harnessdrift.__version__)"
      - name: 跑测试
        # 整套测试不碰网络：调模型的地方都注入了假的 LLM，所以 CI 里不需要 API key。
        # 故意不给 key，任何一处偷偷发起真实请求都会让这里挂掉。
        env:
          LLM_API_KEY: ""
        run: pytest

  pytest-windows:
    # 这个项目是在 Windows 上写出来的，而 CI 原来只跑 ubuntu —— 也就是说
    # 最常用的那个平台反倒没人守。三个地方真的会因平台而异：
    # ① `paths.py` 用 `os.replace` 做原子替换（Windows 上目标被占用会抛 PermissionError）；
    # ② 读文件必须显式 `encoding="utf-8"`，否则 Windows 默认 gbk 直接炸
    #    （真踩过：`UnicodeDecodeError: 'gbk' codec can't decode byte 0xae`）；
    # ③ 路径大小写不敏感，`runs/Curve3` 和 `runs/curve3` 在 Linux 上是两个目录。
    # 只跑一个 Python 版本：验证的是平台差异，不是版本差异。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装
        run: pip install -e ".[dev]"
      - name: 跑测试
        env:
          LLM_API_KEY: ""
          # Windows 控制台默认不是 UTF-8，中文断言失败信息会直接抛 UnicodeEncodeError，
          # 让人误以为是测试挂了。
          PYTHONUTF8: "1"
        run: pytest

  dashboard:
    # 导出看板并做一次无浏览器的渲染冒烟。防的是"导出成功但页面白屏"——
    # 这种问题单跑 pytest 发现不了，只有真人打开才看得见。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装
        run: pip install -e ".[dev]"
      - name: 导出
        run: |
          PYTHONPATH=src python -m harnessdrift.cli export \
            --run runs/curve3 --attr runs/attr_curve3 \
            --compare runs/ablate_strict,runs/ablate_nonregress,runs/ablate_always \
            --out dist/index.html
      - name: 渲染冒烟
        run: node web/smoke.cjs dist/index.html
